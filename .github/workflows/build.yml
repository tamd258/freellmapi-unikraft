name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UNIKRAFT_PROFILE_ENV: "true"
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
      UKC_METRO: sin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取上游 + 放入配置
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          echo "上游 HEAD: $(git -C src rev-parse HEAD)"
          cp Dockerfile src/Dockerfile
          cp Kraftfile src/Kraftfile

      - name: 安装 unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: unikraft build（只产出本地 OCI tar，不推送）
        working-directory: src
        run: |
          unikraft build . --output ./freellmapi.oci.tar
          ls -la freellmapi.oci.tar

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellmapi-oci
          path: src/freellmapi.oci.tar
          retention-days: 3
