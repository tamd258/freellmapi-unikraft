name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
      UKC_METRO: sin
      # 稳定且长度正确的加密密钥（64 hex = 32 字节），部署全程复用，
      # 避免每次随机导致卷上已加密的 provider key 解不开而启动崩溃。
      FREELLMAPI_ENC_KEY: c6214833d959d5c676c179d3f061c90e4126c8bd73bf2cf3a5c8d27ef0a3e1ba
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取上游 + 放入配置
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          echo "上游 HEAD: $(git -C src rev-parse HEAD)"
          cp Dockerfile src/Dockerfile
          cp Kraftfile src/Kraftfile

      - name: 安装 unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: unikraft login（非交互，写全 profile 含 Harbor 凭据）
        run: echo "$UKC_TOKEN" | unikraft login --token - --organization zhoufang

      - name: 删除旧仓库释放 1GiB 配额（清掉之前手搓 push 的孤儿 blob）
        run: |
          unikraft image rm unikraft.io/zhoufang/freellmapi:latest || true
          CREDS=$(printf '%s' "$UKC_TOKEN" | base64 -d)
          U=${CREDS%%:*}; P=${CREDS#*:}
          curl -s -u "$U:$P" -X DELETE "https://unikraft.io/api/v2.0/projects/zhoufang/repositories/freellmapi" -w "harbor-repo-delete:%{http_code}\n" || true

      - name: unikraft build + 推送登记镜像
        working-directory: src
        env:
          UNIKRAFT_TIMEOUT: 600s
        run: unikraft build . --output zhoufang/freellmapi:latest --timeout 600s

      - name: 创建可写卷（SQLite 需要写权限，erofs rootfs 只读）
        run: unikraft volume create --name freellmapi-data --size 1GiB --metro sin || true

      - name: 创建并启动实例（挂卷 + 必要环境变量），记录输出
        id: run
        run: |
          unikraft run --metro=sin --image=zhoufang/freellmapi:latest \
            -p 443:3001/http+tls \
            -m 512MiB --vcpus 1 \
            --scale-to-zero policy=off \
            -v freellmapi-data:/app/server/data \
            -e PORT=3001 -e HOST=0.0.0.0 -e NODE_ENV=production \
            -e FREEAPI_DB_PATH=/app/server/data/freellmapi.db \
            -e ENCRYPTION_KEY=$FREELLMAPI_ENC_KEY \
            -e FREELLMAPI_INSTALL_METHOD=unikraft 2>&1 | tee /tmp/run.out

      - name: 诊断（抓取本次新实例的崩溃日志：sin metro + CLI 正确路径）
        run: |
          BASE=https://api.sin.unikraft.cloud
          # 从 run 输出里取本次新建实例名（输出里有 'name:' 字段）
          NAME=$(grep -m1 '^[[:space:]]*name:' /tmp/run.out 2>/dev/null | awk '{print $2}')
          echo "NEW_INSTANCE=$NAME" >> "$GITHUB_ENV"
          echo "本次新实例名: $NAME"
          sleep 40
          echo "== 所有实例状态 =="
          curl -s -k -H "Authorization: Bearer $UKC_TOKEN" "$BASE/v1/instances" -o /tmp/inst.json -w "http:%{http_code}\n"
          python3 - << 'PY'
          import json
          d=json.load(open('/tmp/inst.json'))
          items=d.get('data',{}).get('instances',[])
          for it in items:
              print('name', it.get('name'), '| state', it.get('state'),
                    '| exit_code', it.get('exit_code'), '| stop_reason', it.get('stop_reason'))
          PY
          if [ -n "$NAME" ]; then
            echo "===================== crash logs (sin metro) for $NAME ====================="
            unikraft instance logs "sin/$NAME" --tail 300 || echo "(logs fetch failed for $NAME)"
          fi
          echo "== health probe =="
          FQDN=$(python3 -c "
          import json
          d=json.load(open('/tmp/inst.json'))
          items=d.get('data',{}).get('instances',[])
          for it in items:
              if it.get('name')=='$NAME':
                  print(it.get('service_group',{}).get('domains',[{}])[0].get('fqdn',''))
          " 2>/dev/null)
          echo "FQDN=$FQDN"
          if [ -n "$FQDN" ]; then
            curl -s -k -m 20 -w "\nHTTP:%{http_code}\n" "https://$FQDN/api/auth/status" || true
          fi
