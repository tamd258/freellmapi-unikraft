name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
      UKC_METRO: sin
      # 稳定且长度正确的加密密钥（64 hex = 32 字节），部署全程复用，
      # 避免每次随机导致卷上已加密的 provider key 解不开而启动崩溃。
      FREELLMAPI_ENC_KEY: c6214833d959d5c676c179d3f061c90e4126c8bd73bf2cf3a5c8d27ef0a3e1ba
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取上游 + 放入配置
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          echo "上游 HEAD: $(git -C src rev-parse HEAD)"
          cp Dockerfile src/Dockerfile
          cp Kraftfile src/Kraftfile

      - name: 安装 unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: unikraft login（非交互，写全 profile 含 Harbor 凭据）
        run: echo "$UKC_TOKEN" | unikraft login --token - --organization zhoufang

      - name: 删除旧仓库释放 1GiB 配额（清掉之前手搓 push 的孤儿 blob）
        run: |
          unikraft image rm unikraft.io/zhoufang/freellmapi:latest || true
          CREDS=$(printf '%s' "$UKC_TOKEN" | base64 -d)
          U=${CREDS%%:*}; P=${CREDS#*:}
          curl -s -u "$U:$P" -X DELETE "https://unikraft.io/api/v2.0/projects/zhoufang/repositories/freellmapi" -w "harbor-repo-delete:%{http_code}\n" || true

      - name: unikraft build + 推送登记镜像
        working-directory: src
        env:
          UNIKRAFT_TIMEOUT: 600s
        run: unikraft build . --output zhoufang/freellmapi:latest --timeout 600s

      - name: 创建可写卷（SQLite 需要写权限，erofs rootfs 只读）
        run: unikraft volume create --name freellmapi-data --size 1GiB --metro sin || true

      - name: 清理旧实例（释放数据卷与配额，否则旧实例占着卷会导致 run 失败）
        run: |
          BASE=https://api.sin.unikraft.cloud
          curl -s -k -H "Authorization: Bearer $UKC_TOKEN" "$BASE/v1/instances" -o /tmp/inst.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/inst.json'))
          items = d.get('data', {}).get('instances', d.get('instances', []))
          ours = [it for it in items if 'freellmapi' in json.dumps(it)]
          open('/tmp/ours.txt', 'w').write('\n'.join(it.get('name', '') for it in ours if it.get('name')))
          print('old instances:', [it.get('name') for it in ours])
          PY
          while IFS= read -r nm; do
            [ -z "$nm" ] && continue
            unikraft instance stop "sin/$nm" --force || true
            unikraft instance delete "sin/$nm" || true
          done < /tmp/ours.txt
          sleep 10

      - name: 创建并启动实例（挂卷 + 已调优的环境变量）
        id: run
        run: |
          unikraft run --metro=sin --image=zhoufang/freellmapi:latest \
            -p 443:3001/http+tls \
            -m 512MiB --vcpus 1 \
            --scale-to-zero policy=off \
            -v freellmapi-data:/app/server/data \
            -e PORT=3001 -e HOST=0.0.0.0 -e NODE_ENV=production \
            -e FREEAPI_DB_PATH=/app/server/data/freellmapi.db \
            -e ENCRYPTION_KEY=$FREELLMAPI_ENC_KEY \
            -e FREELLMAPI_INSTALL_METHOD=unikraft \
            -e PROVIDER_TIMEOUT_NVIDIA=25000 \
            -e PROVIDER_TIMEOUT_GOOGLE=25000 \
            -e PROVIDER_TIMEOUT_GROQ=25000 \
            -e PROVIDER_TIMEOUT_CEREBRAS=25000 \
            -e PROVIDER_TIMEOUT_MISTRAL=25000 \
            -e PROVIDER_TIMEOUT_OPENROUTER=25000 \
            -e PROVIDER_STREAM_STALL_TIMEOUT_MS=15000 \
            -e FALLBACK_TIME_BUDGET_MS=15000 \
            -e SLOW_ENDPOINT_BUFFER_MS=5000 \
            -e MAX_CONSECUTIVE_UPSTREAM_FAILS=3 \
            -e REQUEST_MAX_TOKENS_BUDGET=120000 \
            -e FALLBACK_DETAIL_HEADER=1 \
            -e FREELLMAPI_COMPRESSION=standard \
            2>&1 | tee /tmp/run.out

      - name: 诊断（健康探测 + 打印 FQDN）
        run: |
          BASE=https://api.sin.unikraft.cloud
          sleep 40
          curl -s -k -H "Authorization: Bearer $UKC_TOKEN" "$BASE/v1/instances" -o /tmp/inst.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/inst.json'))
          items = d.get('data', {}).get('instances', d.get('instances', []))
          ours = [it for it in items if 'freellmapi' in json.dumps(it)]
          for it in items:
              doms = [x.get('fqdn') for x in ((it.get('service_group') or {}).get('domains') or [])]
              print('name', it.get('name'), '| state', it.get('state'), '| domains', doms)
          t = (ours or items)
          doms = [x.get('fqdn') for x in ((t[0].get('service_group') or {}).get('domains') or [])]
          print('FQDN=' + (doms[0] if doms else ''))
          PY
          FQDN=$(python3 -c "
          import json
          d=json.load(open('/tmp/inst.json'))
          items=d.get('data',{}).get('instances',d.get('instances',[]))
          ours=[it for it in items if 'freellmapi' in json.dumps(it)]
          t=(ours or items)
          doms=[x.get('fqdn') for x in ((t[0].get('service_group') or {}).get('domains') or [])]
          print(doms[0] if doms else '')
          ")
          if [ -n "$FQDN" ]; then
            curl -s -k -m 20 -w "\nHTTP:%{http_code}\n" "https://$FQDN/api/auth/status" || true
          fi
