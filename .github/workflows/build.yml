name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UNIKRAFT_PROFILE_ENV: "true"
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
      UKC_METRO: sin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取上游最新代码 + 放入 Dockerfile/Kraftfile
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          echo "上游 HEAD: $(git -C src rev-parse HEAD)"
          cp Dockerfile src/Dockerfile
          cp Kraftfile src/Kraftfile

      - name: 安装 unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: ★ build 帮助
        run: |
          unikraft build --help 2>&1 | head -60 || true

      - name: ★ 试输出格式 1：裸名字
        working-directory: src
        continue-on-error: true
        run: unikraft build . --output freellmapi:latest 2>&1 | tail -25

      - name: ★ 试输出格式 2：index.sin.unikraft.cloud/zhoufang/...
        working-directory: src
        continue-on-error: true
        run: unikraft build . --output index.sin.unikraft.cloud/zhoufang/freellmapi:latest 2>&1 | tail -25

      - name: ★ 试输出格式 3：不加 tag
        working-directory: src
        continue-on-error: true
        run: unikraft build . --output freellmapi 2>&1 | tail -25

      - name: 列出平台镜像
        if: always()
        run: unikraft images list 2>&1 | tail -20 || true
