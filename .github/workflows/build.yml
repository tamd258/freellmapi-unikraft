name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UNIKRAFT_PROFILE_ENV: "true"
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
      UKC_METRO: sin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取上游最新代码 + 放入 Dockerfile/Kraftfile
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          echo "上游 HEAD: $(git -C src rev-parse HEAD)"
          cp Dockerfile src/Dockerfile
          cp Kraftfile src/Kraftfile

      - name: 安装 unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: unikraft build（输出必须是 <org>/<app>:<tag>）
        working-directory: src
        run: unikraft build . --output zhoufang/freellmapi:latest

      - name: 列出平台镜像
        if: always()
        run: unikraft images list || true
