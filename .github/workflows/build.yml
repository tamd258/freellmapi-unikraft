name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取 FreeLLMAPI 上游最新代码
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          echo "上游 HEAD: $(git -C src rev-parse HEAD)"

      - name: 放入 Dockerfile 与 Kraftfile
        run: |
          cp Dockerfile src/Dockerfile
          cp Kraftfile src/Kraftfile

      - name: 安装 unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.unikraft/bin" >> $GITHUB_PATH
          ls -la "$HOME/.unikraft/bin" || true

      - name: CLI 版本
        run: unikraft version || unikraft --version || true

      - name: unikraft build（打包 + 推送到平台镜像库）
        working-directory: src
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: sin
        run: |
          unikraft build . --output /freellmapi:latest
