name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (只拿 Dockerfile)
        uses: actions/checkout@v4

      - name: 拉取 FreeLLMAPI 上游最新代码
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          echo "上游 HEAD: $(git -C src rev-parse HEAD)"

      - name: 放入我们的 Dockerfile
        run: cp Dockerfile src/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（linux/amd64）
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:latest
