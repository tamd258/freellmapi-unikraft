name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UNIKRAFT_PROFILE_ENV: "true"
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
      UKC_METRO: sin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取上游 + 放入配置文件
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          cp Dockerfile src/Dockerfile
          cp Kraftfile src/Kraftfile
          echo "--- Kraftfile ---"; cat Kraftfile

      - name: 安装 CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: ★ build 的完整帮助
        run: unikraft build --help 2>&1 | sed -n '1,120p' || true

      - name: ★ images 子命令
        run: unikraft images --help 2>&1 | sed -n '1,60p' || true

      - name: ★ 带 debug 日志构建（拿完整错误）
        working-directory: src
        continue-on-error: true
        run: |
          unikraft build . --output zhoufang/freellmapi:latest --log-level debug 2>&1 | tail -80

      - name: ★ 不带 log-level 再试一次（对照）
        working-directory: src
        continue-on-error: true
        run: |
          unikraft build . --output zhoufang/freellmapi:latest 2>&1 | tail -40
