name: build-unikraft-image
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
      UKC_METRO: sin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取上游 + 放入配置
        run: |
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git src
          echo "上游 HEAD: $(git -C src rev-parse HEAD)"
          cp Dockerfile src/Dockerfile
          cp Kraftfile src/Kraftfile

      - name: 安装 unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: unikraft login（非交互，写全 profile 含 Harbor 凭据）
        run: echo "$UKC_TOKEN" | unikraft login --token - --organization zhoufang

      - name: 删除旧仓库释放 1GiB 配额（清掉之前手搓 push 的孤儿 blob）
        run: |
          # 控制面删除（能正确释放配额）
          unikraft image rm unikraft.io/zhoufang/freellmapi:latest || true
          # Harbor 仓库级删除兜底（清孤儿 blob，需项目权限；失败忽略）
          CREDS=$(printf '%s' "$UKC_TOKEN" | base64 -d)
          U=${CREDS%%:*}; P=${CREDS#*:}
          curl -s -u "$U:$P" -X DELETE "https://unikraft.io/api/v2.0/projects/zhoufang/repositories/freellmapi" -w "harbor-repo-delete:%{http_code}\n" || true

      - name: unikraft build + 推送登记镜像
        working-directory: src
        env:
          UNIKRAFT_TIMEOUT: 600s
        run: unikraft build . --output zhoufang/freellmapi:latest --timeout 600s

      - name: 创建并启动实例
        run: |
          unikraft run --metro=sin --image=zhoufang/freellmapi:latest \
            -p 443:3001/http+tls \
            -m 512MiB --vcpus 1 \
            --scale-to-zero policy=off \
            -e PORT=3001 -e HOST=0.0.0.0 -e NODE_ENV=production
